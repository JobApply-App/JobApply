  - id: p08-j1
    title: Scientist, Immuno-Oncology
    company: Arbel Therapeutics
    location: Ness Ziona
    language: en
    fit: strong
    requirements:
      - {req: "Ph.D. in immunology or related", met: true, evidence: "Ph.D. Immunology, Weizmann"}
      - {req: "Hands-on T-cell biology", met: true, evidence: "T-cell activation and exhaustion projects"}
