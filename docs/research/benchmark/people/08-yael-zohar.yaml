    text: |
      Arbel Therapeutics is a biotech company developing cell therapies for solid tumours. We are 70 people in Ness Ziona.

      We are hiring a Scientist for the immuno-oncology discovery team.

      What you will do
      - Design and run experiments on T-cell function and exhaustion in tumour models.
      - Develop and run multi-colour flow cytometry panels and cell-sorting experiments.
      - Use CRISPR editing in primary human T cells to test new targets.
      - Analyse sequencing data together with our computational biologists.
      - Present results to the research leadership and write study reports.
      - Guide a research associate.

      What we need
      - Ph.D. in immunology, molecular biology or a related field.
      - Hands-on experience in T-cell biology.
      - Strong multi-colour flow cytometry skills.
      - Experience with CRISPR in primary cells.
      - 0-3 years of postdoctoral or industry experience.
      - Ability to analyse your own data in R or Python.

      Nice to have
      - Single-cell RNA sequencing.
      - Experience with tumour models or clinical samples.

      On site, Ness Ziona.

