      רותם אנרגיה מתקינה מערכות סולאריות למפעלים ולמבני ציבור.

      אנחנו מחפשים חשב/ת שידווח לסמנכ"ל הכספים.

      מה כולל התפקיד
      - אחריות על סגירה חודשית ועל הדוחות הכספיים הרבעוניים והשנתיים.
      - ניהול 3 מנהלות חשבונות.
      - עבודה מול רואי החשבון המבקרים ומול רשויות המס.
      - בקרה תקציבית וניתוח סטיות.
      - שיפור תהליכי העבודה במחלקה ובמערכת הפריוריטי.

      דרישות
      - רישיון רואה חשבון או תואר ראשון בחשבונאות.
      - ניסיון בהכנת דוחות כספיים.
      - ידע מעמיק בהנהלת חשבונות.
      - ניסיון בניהול מנהלי חשבונות.
      - שליטה בפריוריטי ובאקסל.

      יתרון
      - ניסיון בחברת פרויקטים.
      - ניסיון במשרד רואי חשבון.

      משרה מלאה, קריית גת.

