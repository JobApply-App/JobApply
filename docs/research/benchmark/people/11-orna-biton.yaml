jobs:
  - id: p11-j1
    title: מנהל/ת חשבונות סוג 3
    company: אופק ייבוא ושיווק
    location: אשדוד
    language: he
    fit: strong
    requirements:
      - {req: "Level 3 bookkeeping certificate", met: true, evidence: "certified 2011"}
      - {req: "5+ years as a bookkeeper", met: true, evidence: "13 years of work, 11 before the break"}
      - {req: "Bookkeeping up to trial balance", met: true, evidence: "Sela Import"}
      - {req: "Import: foreign currency and customs files", met: true, evidence: "letters of credit, customs files"}
      - {req: "Priority", met: true, evidence: "course in 2024 and current job"}
    text: |
      אופק ייבוא ושיווק מייבאת כלי בית ומשווקת אותם לרשתות ולחנויות.

      אנחנו מחפשים מנהל/ת חשבונות סוג 3 למחלקת הכספים.

      מה כולל התפקיד
      - הנהלת חשבונות מלאה עד מאזן בוחן.
      - התאמות בנקים וכרטיסי אשראי.
      - טיפול בספקים בחו"ל: תשלומים במטבע חוץ, אשראי דוקומנטרי ותיקי יבוא.
      - תשלומים לספקים ומעקב אחר גבייה מלקוחות.
      - הכנת דוחות מע"מ ומקדמות.
      - הכנת חומר לדוח השנתי עבור רואה החשבון.

      דרישות
      - תעודת מנהל/ת חשבונות סוג 3. דרישת חובה.
      - 5 שנות ניסיון ומעלה בהנהלת חשבונות.
      - ניסיון בהנהלת חשבונות עד מאזן בוחן.
      - ניסיון בחברת יבוא, כולל מטבע חוץ ותיקי יבוא.
      - שליטה בפריוריטי.
      - שליטה טובה באקסל.

      יתרון
      - ניסיון בהדרכת מנהלי חשבונות צעירים.
      - מגורים באשדוד או בסביבה.

      משרה מלאה, אשדוד. אפשרות ל-80% משרה.

