jobs:
  - id: p04-j1
    title: Operations Manager
    company: Pinecrest Fulfilment
    location: Shoham
    language: en
    fit: strong   # she exceeds every requirement; overqualification must not lower the score
    years_token: "at least 15 years"   # variant replaces this with "at least 5 years"
    requirements:
      - {req: "at least 15 years in logistics or fulfilment operations", met: true, evidence: "18 years"}
      - {req: "Managing a warehouse or fulfilment site with 80+ people", met: true, evidence: "110, 180, then 320 people"}
      - {req: "WMS experience", met: true, evidence: "led two WMS projects"}
      - {req: "Budget and KPI ownership", met: true, evidence: "35M and 60M NIS budgets"}
      - {req: "Carrier management", met: true, evidence: "carrier contracts at Solvane"}
    text: |
      Pinecrest Fulfilment runs e-commerce fulfilment for 60 online brands from our centre in Shoham, shipping about 12,000 orders a day.

      We are looking for an Operations Manager to run the site.

      What you will do
      - Manage the daily operation: receiving, storage, picking, packing and dispatch, with 90 employees in 2 shifts.
      - Lead 4 shift managers and build the team under them.
      - Own the site's KPIs: accuracy, on-time dispatch, cost per order, safety.
      - Work with our WMS vendor on improvements and with the carriers on pickup and service levels.
      - Prepare and manage the site's annual budget.

      What we need
      - at least 15 years of experience in logistics or fulfilment operations.
      - Experience managing a warehouse or fulfilment site with 80 or more employees.
      - Hands-on experience with a warehouse management system (WMS).
      - Experience owning a budget and operational KPIs.
      - Experience managing carriers and service levels.

      Nice to have
      - E-commerce fulfilment background.
      - Lean or continuous-improvement training.

      On site, Shoham.

  - id: p04-j2
    title: Chief Operating Officer
    company: Halcyon Biologics
    location: Rehovot
    language: en
    fit: partial
    requirements:
      - {req: "15+ years in operations, 5+ at executive level", met: true, evidence: "18 years, VP since 2020 (4-5 years)"}
      - {req: "Pharmaceutical or biotech manufacturing (GMP)", met: false, evidence: "logistics and e-commerce only"}
      - {req: "Experience with FDA or EMA regulated operations", met: false, evidence: "none"}
      - {req: "Budget ownership and board reporting", met: true, evidence: "60M NIS, monthly board reports"}
      - {req: "Building a leadership team", met: true, evidence: "hired 3 directors"}
    text: |
      Halcyon Biologics develops and manufactures biologic drugs for rare diseases. We have 260 employees and one manufacturing site in Rehovot.

      We are hiring a Chief Operating Officer, reporting to the CEO.

      What you will do
      - Lead manufacturing, supply chain, quality operations and facilities.
      - Prepare the manufacturing site for commercial scale and for regulatory inspections.
      - Own the operating budget and report to the board.
      - Build the operations leadership team as the company grows from clinical to commercial stage.
      - Manage relationships with contract manufacturers and key suppliers.

      What we need
      - 15+ years in operations, including at least 5 years at executive level.
      - Experience in pharmaceutical or biotech manufacturing under GMP. This is a hard requirement.
      - Experience leading operations regulated by the FDA or EMA, including inspections.
      - Experience owning a large budget and reporting to a board.
      - A record of building and developing a leadership team.

      Nice to have
      - Experience with biologics or sterile manufacturing.
      - A degree in engineering or life sciences.

      On site, Rehovot.

