      Vantrell AI builds computer-vision models that inspect products on factory lines.

      We are hiring a Senior Machine Learning Engineer for the detection team.

      What you will do
      - Train and improve object-detection and segmentation models in PyTorch.
      - Build the training and evaluation pipelines, including data versioning.
      - Optimise models to run on edge devices at 30 frames a second.
      - Work with customers' data: labelling strategy, hard cases, drift.
