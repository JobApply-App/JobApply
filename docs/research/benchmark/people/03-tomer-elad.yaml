      - Publications in computer vision.

      Tel Aviv, on site 4 days a week.

  - id: p03-j2
    title: Product Manager
    company: Dovetail Field
    location: Tel Aviv
    language: en
    fit: strong
    requirements:
      - {req: "2+ years as a product manager in B2B SaaS", met: true, evidence: "2 years as APM and PM at Hadria"}
      - {req: "Owning a product area with an engineering squad", met: true, evidence: "onboarding and billing, 6 engineers"}
      - {req: "User research and discovery", met: true, evidence: "30 customer interviews"}
      - {req: "Working with product metrics", met: true, evidence: "Mixpanel, activation, upgrades"}
      - {req: "Writing clear requirements", met: true, evidence: "PRDs, acceptance criteria"}
    text: |
      Dovetail Field makes scheduling and invoicing software for small service businesses: electricians, cleaners, installers. 4,000 businesses use it every day.

      We are looking for a Product Manager to own the activation area: everything from sign-up to the first invoice sent.

      What you will do
      - Own the roadmap for onboarding and activation, with a squad of 5 engineers and a designer.
      - Talk to customers every week and turn what you learn into clear problems to solve.
      - Write requirements that engineers and QA can build and test from.
      - Define the metrics for your area and follow them: activation rate, time to first invoice, conversion to paid.
      - Work with sales, support and customer success on what customers ask for.

      What we need
      - 2+ years of experience as a product manager in a B2B SaaS product.
      - Experience owning a product area together with an engineering squad.
      - Real experience with user research and discovery.
      - Comfort with product data: funnels, cohorts, A/B tests.
      - Clear writing in English.

      Nice to have
      - Experience with onboarding, billing or self-service flows.
      - A technical background such as QA or development.

      Hybrid, Tel Aviv.

