    text: |
      מרלו"ג השרון הוא מרכז לוגיסטי שמפיץ מוצרי מזון יבשים ל-500 נקודות מכירה באזור השרון והמרכז.

      אנחנו מחפשים מנהל/ת משמרת למשמרת הבוקר.

      מה כולל התפקיד
      - ניהול משמרת של 30 מלקטים, מלגזנים ועובדי הפצה.
      - תכנון העבודה היומי לפי ההזמנות וטיפול בהיעדרויות.
      - אחריות על עמידה ביעדי המשמרת: דיוק ליקוט ויציאה בזמן.
      - אחריות על הציוד ועל המלאי במשמרת, כולל ספירות.
      - שמירה על נוהלי הבטיחות והדרכת עובדים חדשים.
      - דיווח יומי למנהל התפעול.

      דרישות
      - ניסיון בניהול צוות של 20 עובדים ומעלה.
      - ניסיון כלשהו בלוגיסטיקה או בתפעול.
      - יכולת תכנון עבודה יומית וקבלת החלטות תחת לחץ.
      - ניסיון באחריות על ציוד ומלאי.
      - שליטה טובה באקסל.

      יתרון
      - קצינים משוחררים מתפקידי פיקוד או לוגיסטיקה.
      - היכרות עם מערכת לניהול מחסן.

      משרה מלאה, כפר סבא. משמרת בוקר, 06:00 עד 15:00.

