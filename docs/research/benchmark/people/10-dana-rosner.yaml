jobs:
  - id: p10-j1
    title: Head of Marketing
    company: Calloway Sport
    location: Tel Aviv
    language: en
    fit: strong
    requirements:
      - {req: "8+ years in consumer or retail marketing", met: true, evidence: "10 years"}
      - {req: "Managing a marketing team", met: true, evidence: "team of 3"}
      - {req: "Owning a marketing budget of several million NIS", met: true, evidence: "7M NIS"}
      - {req: "Digital campaigns and retail promotions", met: true, evidence: "both, at Verdane and Homestead"}
      - {req: "Loyalty or CRM programmes", met: true, evidence: "400,000-member loyalty club"}
    text: |
      Calloway Sport is a chain of 25 sports stores with a growing online shop.

      We are hiring a Head of Marketing to lead the marketing team and report to the CEO.

      What you will do
      - Lead a team of 4 covering digital, stores and the loyalty club.
      - Own the yearly marketing plan and a budget of 6 million NIS.
      - Plan the promotion calendar with the commercial team.
      - Run digital campaigns with our agency and measure what they bring.
      - Grow the loyalty club and its communications.
      - Work with store managers on displays and seasonal launches.

      What we need
      - 8+ years of experience in consumer or retail marketing.
      - Experience managing a marketing team.
      - Experience owning a marketing budget of several million NIS.
      - Hands-on background in both digital campaigns and in-store promotions.
      - Experience with a loyalty club or CRM programme.

      Nice to have
      - Sports, outdoor or fashion background.
      - Experience working with agencies.

      Hybrid, Tel Aviv.

  - id: p10-j2
    title: E-commerce Director
    company: Northfell Gear
    location: Netanya
    language: en
    fit: partial
    requirements:
      - {req: "6+ years leading an e-commerce business with revenue responsibility", met: false, evidence: "ran campaigns that drove online sales, never owned the online shop"}
      - {req: "Owning the site, conversion and merchandising", met: false, evidence: "none"}
      - {req: "Digital marketing and email", met: true, evidence: "paid campaigns, 85,000 email subscribers"}
      - {req: "Managing a team and a budget", met: true, evidence: "team of 3, 7M NIS"}
      - {req: "Outdoor or sporting-goods background", met: true, evidence: "4 years in camping and outdoor retail"}
    text: |
      Northfell Gear sells camping and hiking equipment in 18 stores and online.

      Northfell Gear is looking for an E-commerce Director to run the online business, which is now 22% of company sales.

      What you will do
      - Own online revenue and profit for Northfell Gear.
      - Run the site: merchandising, search, conversion and checkout.
      - Lead a team of 5: site trading, digital marketing and customer service for online orders.
      - Manage the platform vendor and the fulfilment partner.
      - Plan digital marketing and email with the marketing department.
      - Report weekly trading numbers to management.

      What we need
      - 6+ years leading an e-commerce business with responsibility for revenue.
      - Experience owning a site: conversion, merchandising and platform.
      - Strong knowledge of digital marketing and email.
      - Experience managing a team and a budget.
      - A background in outdoor or sporting goods.

      Nice to have
      - Experience with Shopify Plus or Magento.
      - Experience with marketplaces.

      Hybrid, Netanya.

  - id: p10-j3
    title: DevOps Engineer
    company: Stratus Forge
    location: Tel Aviv
    language: en
    fit: none
    requirements:
      - {req: "4+ years in DevOps or SRE", met: false, evidence: "none"}
