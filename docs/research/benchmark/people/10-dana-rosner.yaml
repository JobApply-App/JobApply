      - {req: "AWS or GCP", met: false, evidence: "none"}
      - {req: "Scripting in Python or Bash", met: false, evidence: "none"}
    text: |
      Stratus Forge provides managed cloud platforms to software companies.

      We are looking for a DevOps Engineer for the platform team.

      What you will do
      - Run and improve our Kubernetes clusters on AWS and GCP.
      - Write infrastructure as code in Terraform.
      - Build CI/CD pipelines for our customers' teams.
      - Take part in the on-call rotation and lead incident reviews.
      - Improve monitoring and alerting with Prometheus and Grafana.

      What we need
      - 4+ years of experience in DevOps or site reliability engineering. This is a hard requirement.
      - Strong hands-on Kubernetes and Terraform.
      - Production experience on AWS or GCP.
      - Scripting in Python or Bash.
      - Solid Linux and networking knowledge.

      Nice to have
      - Experience with service meshes.
      - Security certifications.

      Hybrid, Tel Aviv.

