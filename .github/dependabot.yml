# Weekly dependency update PRs (security report, 2026-11-23: no automated
# update checks existed, and the frontend ran a Next.js with a critical
# advisory). Security fixes open as soon as an advisory is published,
# whatever the schedule. Ron reviews and merges every PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    # No PRs for major versions (2026-11-23: next 16, typescript 7 and
    # pandas 3 arrived as 17 PRs that would each need their own migration).
    # Major upgrades are planned on purpose instead. Security alerts still
    # show in the repo's Security tab whatever this says; if a fix needs a
    # major version, do that upgrade by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
