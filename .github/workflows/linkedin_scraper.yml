name: LinkedIn Israel Jobs Scraper

# Runs backend/scripts/linkedin_israel_jobs.py twice a day to pull recent
# "Israel jobs" postings from LinkedIn's public guest API and upsert them
# straight into Supabase Postgres (linkedin.jobs + public.all_jobs) — see
# that script's own module docstring for the full scrape/persistence
# design. This workflow only drives it on a schedule; it contains no
# scraping logic of its own.
#
# WHY UTC, AND HOW TO RE-DERIVE THE TIMES BELOW
# -----------------------------------------------
# GitHub Actions' `schedule.cron` is ALWAYS evaluated in UTC — there is no
# per-workflow timezone setting, so every cron expression below must be
# hand-converted from the target local time, and re-converted by hand
# whenever the target timezone's UTC offset changes.
#
# Israel is UTC+2 (IST, standard time) in winter and UTC+3 (IDT, daylight
# saving) in summer — and unlike most of Europe/US, Israel's DST
# transition dates don't line up with UTC's own (fixed) definition, so a
# single static cron cannot track both offsets at once. The two cron
# entries below are anchored to IDT (UTC+3, summer), which is correct
# roughly Mar-Oct; during IST (roughly Oct-Mar) the runs will fire at
# 23:00 (previous day) and 11:00 Israel time instead of 00:00/12:00 — a
# known 1-hour drift, not a bug. If exact-to-the-minute timing across
# both seasons matters, the fix is to maintain two cron lines per run
# (one IST, one IDT) and comment out whichever doesn't currently apply —
# deliberately not done here to keep the schedule simple, since this
# scraper's own --hours window already tolerates an hour of slack.
#
# HOW TO CHANGE THE SCHEDULE LATER
# -----------------------------------
# Pick your new Israel local time, subtract 3 hours (IDT) to get UTC, and
# write that as "M H * * *" (minute hour, every day). E.g. 06:00 Israel
# (IDT) -> 03:00 UTC -> "0 3 * * *". https://crontab.guru is useful for
# sanity-checking the resulting expression.
#
# HOW TO RUN THIS MANUALLY
# -----------------------------
# Actions tab -> "LinkedIn Israel Jobs Scraper" (this workflow) -> "Run
# workflow" button -> pick the branch -> Run. That's the workflow_dispatch
# trigger below; no schedule wait required to test a change.
on:
  schedule:
    # 00:00 Israel Daylight Time (UTC+3) -> 21:00 UTC the PREVIOUS day
    - cron: "0 21 * * *"
    # 12:00 Israel Daylight Time (UTC+3) -> 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    name: Run LinkedIn scraper
    runs-on: ubuntu-latest
    # The scraper's own two-step safety gate (--allow-linkedin-request CLI
    # flag + ALLOW_LINKEDIN_SCRAPE=true env var, see linkedin_israel_jobs.py's
    # _guard_linkedin_request()) refuses to contact LinkedIn unless BOTH are
    # set — this is deliberately not overridable by accident, so both are
    # supplied explicitly below rather than defaulted.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"  # matches backend/Dockerfile's runtime image
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run LinkedIn scraper
        env:
          # Required — Postgres (Supabase). Without this, both of the
          # script's writes (linkedin.jobs + public.all_jobs) fail; see
          # backend/core/postgres.py. Use the Session pooler connection
          # string (not Direct connection — that's IPv6-only and
          # unreachable from GitHub's runners), from Supabase: Project
          # Settings -> Database -> Connection string -> Session pooler.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required (paired with --allow-linkedin-request below) — the
          # scraper's own safety gate. Not sensitive (just a boolean
          # opt-in flag, not a credential), so it's a plain env value
          # here rather than a secret.
          ALLOW_LINKEDIN_SCRAPE: "true"
          # Optional — comma-separated proxy URLs for round-robin
          # rotation (see linkedin_israel_jobs.py's _load_proxy_pool()).
          # Leave the secret unset/empty to scrape directly with no
          # proxy, same as a local run without PROXY_LIST configured.
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: |
          python backend/scripts/linkedin_israel_jobs.py \
            --allow-linkedin-request \
            --hours 12
        # No `continue-on-error` / `|| true` anywhere in this job — a
        # non-zero exit from the scraper (network failure, LinkedIn
        # blocking, a Postgres upsert failure, or the safety gate itself
        # refusing to run) fails this step, which fails the job, which
        # shows red in the Actions tab and in any branch-protection status
        # check. stdout/stderr are already GitHub Actions' captured step
        # log by default — no extra plumbing needed for log visibility.
