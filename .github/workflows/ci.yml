name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    # Without a database, backend/tests/conftest.py's `db_available` fixture
    # skips every Postgres-backed test — 24 files, ~200 test functions. That
    # run is still green, which is the problem: it looked like the suite
    # passed while the entire data layer went unexercised, including the
    # Alembic wiring and the /health DB probe this repo depends on to notice
    # a broken deployment. A throwaway service container makes those tests
    # actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       jobapply_test
        ports:
          - 5432:5432
        # The job starts as soon as the container is up, which is earlier
        # than Postgres accepting connections — without this the migration
        # step races the server and fails intermittently.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Localhost is exempt from ensure_sslmode() (backend/core/postgres.py),
      # so no TLS listener is needed on the container.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobapply_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Enforce backend.* import convention (no bare api./services./config imports)
        # Bare `api.*` / `services.*` / `config` imports resolve to a second,
        # independent module instance at a different sys.modules key than the
        # `backend.*`-prefixed one main.py actually runs — duplicating
        # rate-limit buckets, JWKS caches, and DB engines silently. See
        # CLAUDE.md and JOB-6. Every intra-backend import must use the
        # `backend.` prefix instead.
        run: |
          if git grep -nE '^\s*(from (api|services|config)(\.|[[:space:]]+import\b)|import[[:space:]]+config\b)' -- backend; then
            echo "::error::Found bare 'api.'/'services.'/'config' import(s) above — use the 'backend.' prefix instead (e.g. 'from backend.services import db'). Bare imports load a second, independent module instance (duplicated rate-limit buckets, JWKS caches, DB engines)."
            exit 1
          fi

      - name: Byte-compile backend
        run: python -m py_compile $(find backend -name "*.py" -not -path "*/tests/*")

      # The migrations reference Supabase's `auth` schema (an FK to
      # auth.users, and auth.uid() inside the RLS policies), which a plain
      # Postgres does not have. See the file's own header for why this is
      # CI-only and deliberately minimal.
      - name: Bootstrap Supabase auth schema (CI only)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/scripts/ci-bootstrap-auth.sql

      # Two Alembic environments, two schemas: alembic_app_schema owns
      # `public`, alembic_linkedin owns `linkedin`. Both are needed — the
      # LinkedIn ingestion tests query linkedin.jobs directly.
      - name: Apply migrations
        run: |
          alembic -c alembic_app_schema.ini upgrade head
          alembic -c alembic_linkedin.ini  upgrade head

      # One constraint cannot hold here: profiles.id references auth.users,
      # a table Supabase owns and populates through its auth API. CI has no
      # auth provider, so nothing can legitimately put rows in the stub —
      # and the app's own get_or_create(), which creates the profiles row,
      # fails against an empty auth.users.
      #
      # Dropping exactly that one FK keeps every constraint this codebase
      # actually owns (profiles -> each tenant table) enforced, which is
      # what the tests are there to exercise. The alternative — seeding a
      # fake auth.users row per test — would assert nothing real about
      # Supabase and would hide genuine FK regressions on our own tables.
      - name: Relax the Supabase-owned FK (CI only)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'ALTER TABLE public.profiles DROP CONSTRAINT IF EXISTS fk_profiles_id_auth_users;'

      # Fails loudly if the database is unreachable, instead of letting the
      # suite skip its way to a green tick. Uses the same engine the tests
      # use, so it fails for exactly the reasons they would have skipped.
      - name: Verify database is reachable
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from backend.core.postgres import PG_ENGINE
          with PG_ENGINE.connect() as conn:
              conn.execute(text("SELECT 1"))
          print("database reachable")
          PY

      # -rs prints the reason for every skip. The suite is allowed to skip
      # tests that need live third-party credentials, but a skip should
      # always be legible in the log rather than a bare 's'.
      - name: Run backend tests
        env:
          ANTHROPIC_API_KEY: 'test-key'
        run: pytest backend/tests -q -rs

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `next lint` against frontend/.eslintrc.json (next/core-web-vitals).
        # `--max-warnings 0` makes warnings fail the job too. The backlog that
        # made this untenable before is gone: the 10 warnings were worked down
        # to 0 across #27 and this change, each either fixed properly or
        # suppressed inline with a written reason at the exact site.
        #
        # The point of the zero here is that it is now cheap to hold. A new
        # warning is a decision someone has to make and record on the spot,
        # rather than a line item that quietly joins a list nobody re-reads.
        # Suppressing one still requires a comment explaining why, so the
        # escape hatch stays visible in review.
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # vitest (frontend/src/**/*.test.ts). CI ran typecheck and build but
        # never the test suite, so the assertions in it could rot without
        # anything going red.
        run: npm test

      - name: Build
        run: npm run build
