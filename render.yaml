# Render Blueprint — deploys the FastAPI backend as an always-on web
# service, reusing backend/Dockerfile as-is (no changes to that file).
# Needed because Vercel (frontend) only hosts static/serverless functions —
# it can't run this app's background asyncio loops (enrichment/discovery,
# see backend/main.py's startup) or reach a backend on your own machine.
# See frontend/next.config.mjs's rewrites() comment for the other half of
# this wiring (BACKEND_URL).
#
# Setup (one-time):
#   1. https://dashboard.render.com -> New -> Blueprint -> connect this repo.
#      Render finds this file automatically.
#   2. Render creates the service below but leaves every `sync: false` env
#      var empty — fill in real values under the service's Environment tab
#      (same values as your local backend/.env; never commit them here).
#   3. Once deployed, copy the service's URL (https://<name>.onrender.com)
#      into Vercel's project settings -> Environment Variables -> BACKEND_URL,
#      then redeploy the Vercel frontend so the rewrite proxy picks it up.
#
# Local dev/Docker are UNAFFECTED by this file — docker-compose.yml and
# `uvicorn --reload` keep working exactly as before.
services:
  - type: web
    name: jobapply-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    # `starter` rather than `free` because a free instance spins down after
    # ~15 minutes idle, and every consequence of that is silent rather than
    # error-producing:
    #   - cold start is not a small delay. Measured on the deployed service:
    #     6s, then 64s, then 78s on separate days. At 78s the first visitor
    #     after a quiet spell does not experience a slow app, they get a
    #     failed request — past the patience of a browser fetch, an upstream
    #     proxy, and a person. That is every first-time visitor, which is the
    #     one request that has to work.
    #   - the three background loops in main.py (enrichment 30s, all-jobs
    #     matching 30min, discovery 24h) only run while the instance is awake,
    #     so match scoring and the Matches feed advance sporadically instead
    #     of on their configured intervals. This degrades the product quietly
    #     even for users who never notice a slow page.
    #   - memory is capped at 512MB, and the Chromium that backend/Dockerfile
    #     installs for PDF export routinely needs a large share of that.
    #
    # A scheduled GitHub workflow was tried first, to keep the instance warm
    # for free. It did not work: GitHub throttles scheduled runs hard, and it
    # fired 28 times in seven days against a schedule of 756 — about 3%. The
    # backend still cold-started at 78s with it running. It is removed in the
    # same change as this line; a paid instance does not sleep, so keeping it
    # would only burn Actions minutes.
    plan: starter
    healthCheckPath: /health
    # Overrides the Dockerfile's own dev CMD (which uses --reload — fine
    # locally with a bind-mounted volume, wasteful/pointless on a static
    # deployed image) and binds to Render's own dynamic $PORT instead of
    # the hardcoded 8000 the local Dockerfile/docker-compose.yml use.
    #
    # This replaces CMD only — the Dockerfile's ENTRYPOINT
    # (backend/scripts/docker-entrypoint.sh) still wraps it, so
    # `alembic upgrade head` runs against DATABASE_URL before uvicorn
    # starts. A failed migration exits non-zero and Render keeps the
    # previous release serving instead of promoting this one.
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      # Required — without this, both Postgres writes (linkedin.jobs +
      # public.all_jobs) and every other DB-backed route fail. Use the
      # Supabase Session pooler connection string (Project Settings ->
      # Database -> Connection string -> Session pooler) — the Direct
      # connection is IPv6-only and unreachable from most PaaS networks,
      # same issue hit earlier with GitHub Actions runners.
      - key: DATABASE_URL
        sync: false
      # Required for authenticated routes (backend/api/deps.py 503s
      # without at least one of SUPABASE_URL / SUPABASE_JWT_SECRET set).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Required. APP_ENV=production above makes config._compute_cors_origins()
      # use THIS list and nothing else — the localhost/dev defaults are not
      # applied in production. Leaving it unset yields an empty allow-list, so
      # every browser request is rejected while the service still passes health
      # checks and logs look clean: the API appears dead from the frontend with
      # no obvious cause. Comma-separated, scheme included, no trailing slash,
      # e.g. https://job-apply-chi.vercel.app,https://app.example.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Required for Ariel/chat and every LLM-backed feature (CV tailoring,
      # match scoring, etc.) — those routes 503 without it, everything else
      # still works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — feature-specific keys. Leave blank in the dashboard to
      # simply disable that one feature rather than the whole app; every
      # call site already guards for a missing key.
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_LINKEDIN_HOST
        sync: false
      - key: RAPIDAPI_LINKEDIN_PATH
        sync: false
      - key: RAPIDAPI_LINKEDIN_TIME_FRAME
        sync: false
      - key: SCRAPER_API_KEY
        sync: false
      - key: USE_SCRAPER_API
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
