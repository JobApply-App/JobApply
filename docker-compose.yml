# Dev-mode Docker Compose — brings up the FastAPI backend and the Next.js
# frontend together, mirroring the local `uvicorn --reload` / `npm run dev`
# workflow documented in README.md. Not a production deployment config (no
# multi-stage build, no reverse proxy, no TLS).
#
# Prerequisites (see docs/docker-setup.md):
#   - backend/.env         (copy from backend/.env.example, fill in real values)
#   - frontend/.env.local     (copy from frontend/.env.example)
# Neither file is created by this compose file — both are gitignored and
# must contain real credentials only you have.
#
# Usage:
#   docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # Bind-mount source for --reload live-editing. backend/core/database.py
      # picks Postgres (DATABASE_URL/_DEV/_PROD, resolved in backend/config.py)
      # when configured, falling back to the SQLite file that also lives
      # inside backend/ and persists on the host through this same mount.
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      # Read by the `ofelia` service below (job-exec: runs a command inside
      # THIS already-running container on a schedule, via the Docker
      # socket — no separate always-on process for the scraper itself, it
      # only executes at the scheduled times). Twice daily, 00:00 and
      # 12:00 UTC (6-field cron: seconds first — Ofelia uses robfig/cron
      # WithSeconds). See backend/scripts/run_scheduled_linkedin_scrape.sh.
      ofelia.enabled: "true"
      ofelia.job-exec.linkedin-scrape.schedule: "0 0 0,12 * * *"
      ofelia.job-exec.linkedin-scrape.command: "/app/backend/scripts/run_scheduled_linkedin_scrape.sh"

  ofelia:
    # Docker-native cron — triggers the labeled job-exec command above
    # inside the `backend` container on schedule. This container itself
    # just watches for the next trigger time (negligible idle cost); the
    # actual scrape work only runs twice a day, on demand, not as a
    # separate 24/7 service.
    image: mcuadros/ofelia:latest
    command: daemon --docker
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env.local
    environment:
      # Overrides whatever BACKEND_URL is in .env.local: inside the compose
      # network the backend is reachable at the service name `backend`, not
      # 127.0.0.1 (next.config.mjs's rewrite proxy reads this server-side).
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the container's own Linux node_modules/.next
      # aren't shadowed by the host's (macOS/Windows) bind mount above.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
