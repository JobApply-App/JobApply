<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>{{name}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 210mm 297mm; margin: 0; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:      #0D9488;   /* teal-600 — same brand accent as the product itself */
  --accent-dark: #0F766E;   /* teal-700 — used as small TEXT, not just a background */
  --accent-lt:   #5EEAD4;   /* teal-300 — on the dark header only */
  --ink:         #0F172A;
  --ink-2:       #1E293B;
  --muted:       #475569;
  --faint:       #94A3B8;
  --line:        #E2E8F0;
}

html, body {
  width: 210mm; max-width: 210mm;
  height: 297mm; max-height: 297mm;
  overflow: hidden;
  font-family: "Inter", Arial, "Helvetica Neue", Helvetica, sans-serif;
  font-size: 9.5pt;
  color: var(--ink);
  background: #fff;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 210mm; height: 297mm;
  max-height: 297mm;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Header — dark ink, not corporate blue: matches the product's own
   teal identity instead of a generic navy template block. Name set in a
   serif for a touch of the same editorial character the rest of the
   product uses, everything else stays in Inter for a clean, cohesive
   read. ── */
.header {
  background: var(--ink);
  padding: 22px 26px 18px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 18px;
}

.hdr-left { min-width: 0; }

.hdr-name {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 25pt;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.2px;
  line-height: 1.1;
}

.hdr-title {
  font-size: 8pt;
  font-weight: 600;
  color: var(--accent-lt);
  margin-top: 6px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.hdr-right { text-align: right; flex-shrink: 0; }

.contact-line {
  font-size: 8pt;
  color: rgba(255,255,255,0.72);
  display: block;
  line-height: 1.7;
}

/* ── Body (single column with padding) ── */
.body {
  flex: 1;
  overflow: hidden;
  padding: 16px 26px 12px;
  display: flex;
  flex-direction: column;
}

/* ── Section title — a short accent rule instead of a full-width hairline,
   more like a deliberate editorial mark than a generic template divider. ── */
/* ATS constraint — letter-spacing must stay under ~0.145 x font-size.
Above that, Chromium's PDF output spaces the glyphs far enough apart
that text extractors read "E X P E R I E N C E" instead of
"EXPERIENCE", and an ATS can no longer find the section at all. This
was measured, not guessed: the boundary sits between ratio 0.145
(readable) and 0.150 (broken), consistent across 7-12px font sizes.
Note font-size here is in pt and letter-spacing in px: convert first
(1pt = 1.333px). Section headings carry the keywords a parser keys
on, so widening the tracking for looks costs real matches. */
.sec-title {
  display: block;
  font-size: 7.5pt;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--accent-dark);
  padding-bottom: 5px;
  border-bottom: 2px solid var(--accent);
  margin-bottom: 8px;
  margin-top: 13px;
  width: fit-content;
  min-width: 90px;
}

.main-sec { flex-shrink: 0; margin-bottom: 2px; }
.main-sec:first-of-type .sec-title { margin-top: 0; }

/* ── Summary ── */
.summary-text {
  font-size: 9.5pt;
  color: var(--ink-2);
  line-height: 1.5;
}

/* ── Experience ── */
.exp-entry { margin-bottom: 10px; }

.entry-hdr {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.entry-meta { flex: 1; min-width: 0; }

.entry-role {
  display: block;
  font-size: 10.5pt;
  font-weight: 700;
  color: var(--ink);
}

.entry-company {
  display: block;
  font-size: 8.5pt;
  color: var(--accent-dark);
  font-weight: 600;
  margin-top: 1px;
}

.entry-dates {
  font-size: 8pt;
  color: var(--faint);
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
  font-weight: 500;
}

.bullets { margin-top: 4px; padding-left: 13px; }

.bullets li {
  font-size: 9pt;
  color: var(--ink-2);
  line-height: 1.48;
  margin-bottom: 2px;
  list-style: disc;
}

.bullets li::marker { color: var(--accent); }

/* ── Education ── */
.edu-entry { margin-bottom: 8px; }

.edu-degree {
  display: block;
  font-size: 10pt;
  font-weight: 700;
  color: var(--ink);
}

.edu-institution {
  display: block;
  font-size: 8.5pt;
  color: var(--accent-dark);
  font-weight: 600;
  margin-top: 1px;
}

.edu-honors {
  display: block;
  font-size: 8pt;
  font-weight: 500;
  color: var(--ink-2);
  margin-top: 2px;
  font-style: italic;
}

.edu-coursework {
  display: block;
  font-size: 8pt;
  color: var(--faint);
  margin-top: 1px;
}

/* ── Side sections in single-column mode ── */
.side-sec { flex-shrink: 0; margin-bottom: 9px; }

/* ── Skills ── */
.skill-cat { margin-bottom: 5px; }

.skill-cat-label {
  font-size: 7pt;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  display: block;
  margin-bottom: 2px;
}

/* Plain inline text — no badge styling; delimiters written by Python */
.skill-items {
  font-size: 8.5pt;
  color: var(--ink-2);
  display: block;
  line-height: 1.5;
}

/* ── Languages ── */
.lang-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 3px;
}

.lang-name { font-size: 8.5pt; font-weight: 600; color: var(--ink-2); }
.lang-level { font-size: 8pt; color: var(--faint); }

/* ── Military ── */
.mil-role { display: block; font-size: 9pt; font-weight: 700; color: var(--ink); }
.mil-unit { display: block; font-size: 8.5pt; color: var(--accent-dark); font-weight: 600; margin-top: 1px; }

/* ── Volunteering ── */
.vol-text { font-size: 8.5pt; color: var(--ink-2); line-height: 1.48; }
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <div class="hdr-left">
      <h1 class="hdr-name">{{name}}</h1>
      <div class="hdr-title">{{title}}</div>
    </div>
    <div class="hdr-right">
      <span class="contact-line">{{email}}</span>
      {{phone_line}}
      <span class="contact-line">{{linkedin}}</span>
      {{location_line}}
    </div>
  </header>

  <div class="body">
    <div class="main-sec">
      <h2 class="sec-title">Professional Summary</h2>
      <div class="summary-text">{{summary}}</div>
    </div>

    <div class="main-sec">
      <h2 class="sec-title">Experience</h2>
      {{experience_blocks}}
    </div>

    <div class="main-sec">
      <h2 class="sec-title">Education</h2>
      {{education_blocks}}
    </div>

    {{skills_section}}
    {{languages_section}}
    {{military_section}}
    {{volunteering_section}}
  </div>

</div>

<script>
/* Shrink-to-fit: scale the flowing body content down as a whole so it fits
   within the single A4 page instead of being silently clipped by
   `.body { overflow: hidden }`. A uniform transform works regardless of
   which absolute unit (pt/px) each rule below uses — unlike changing the
   root font-size, which does not cascade into descendants that declare an
   absolute pt size (i.e. almost everything here), and therefore never
   actually shrank anything.
   `.body`'s own clientHeight already equals the space the flex layout
   assigned it (page height minus the fixed header) — no manual page/header
   math needed. scrollHeight is unaffected by overflow: hidden, so it still
   reports the true, un-clipped content height.
   MIN_SCALE raised from 0.72 to 0.88: at this template's 9-10pt baseline,
   0.72 would bottom out around 6.5pt — well past the "never below 10pt"
   readability floor real resume guidance sets. 0.88 keeps the worst case
   at ~8pt, and content volume upstream (_enforce_limits in pdf_builder.py)
   is what actually keeps this from triggering often in practice. */
(function () {
  var MIN_SCALE = 0.88;
  var body = document.querySelector('.body');
  if (!body) return;
  var available = body.clientHeight;
  var needed    = body.scrollHeight;
  if (available > 0 && needed > available) {
    var scale = Math.max(MIN_SCALE, available / needed);
    body.style.transformOrigin = 'top left';
    body.style.transform       = 'scale(' + scale + ')';
    body.style.width           = (100 / scale) + '%';
  }
})();
</script>
</body>
</html>
